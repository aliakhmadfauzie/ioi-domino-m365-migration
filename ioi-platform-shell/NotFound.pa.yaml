Screens:
  NotFound:
    Properties:
      Fill: =ColorBg
    Children:
      - rootNotFound:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =14
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - lblNotFoundMark:
                Control: ModernText
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Center
                  Color: =ColorPrimary
                  FontWeight: =FontWeight.Bold
                  Height: =72
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =56
                  Text: ="404"
                  Wrap: =false
            - lblNotFoundTitle:
                Control: ModernText
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Center
                  Color: =ColorText
                  FontWeight: =FontWeight.Semibold
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =24
                  Text: ="Page not found"
                  Wrap: =false
            - lblNotFoundBody:
                Control: ModernText
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Center
                  AutoHeight: =true
                  Color: =ColorMuted
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: ="The record or page you requested could not be found. It may have been moved, deleted, or the link is invalid."
                  Width: =420
            - btnNotFoundHome:
                Control: ModernButton
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BasePaletteColor: =ColorPrimary
                  Height: =44
                  Icon: =Icon.Home
                  OnSelect: =Navigate(Home, ScreenTransition.Fade)
                  Text: ="Go to Home"
                  Width: =180
