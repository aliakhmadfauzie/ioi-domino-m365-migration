                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |=Coalesce(varCurrentItem.EmployeeName, varCurrentItem.SubmittedBy, varCurrentItem.Author.DisplayName, "—")
                              Wrap: =false
                  - SRDetApprovalRow2:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =44
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - dotStage2:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: |=Switch(
                                varCurrentStatus,
                                "Submitted", ColorPending,
                                "EndorsedHOD", ColorApproved,
                                "ApprovedHR", ColorApproved,
                                "ApprovedCOO", ColorApproved,
                                "ApprovedED", ColorApproved,
                                "Rejected", ColorRejected,
                                ColorMuted
                              )
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: |=If(varCurrentStatus = "Draft" || varCurrentStatus = "Returned", "○", "●")
                              Width: =24
                              Wrap: =false
                        - lblStage2:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorText
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="HOD Review"
                              Width: =100
                              Wrap: =false
                        - lblStage2Status:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorMuted
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |=Switch(
                                varCurrentStatus,
                                "Submitted", "Pending…",
                                "EndorsedHOD", "✅ Endorsed",
                                "ApprovedHR", "✅ Endorsed",
                                "Rejected", "Rejected",
                                "—"
                              )
                              Wrap: =false
                  - SRDetApprovalRow3:
                      Control: GroupContainer
                      Variant: AutoLayout
