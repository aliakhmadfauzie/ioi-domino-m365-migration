                              Color: =ColorText
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="Submitted"
                              Width: =100
                              Wrap: =false
                        - lblStage1By:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorMuted
                              Height: =22
