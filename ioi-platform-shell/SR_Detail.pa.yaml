                  - txtSRDetRemarks:
                      Control: ModernTextInput
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        Default: =varSRRemarks
                        Height: =60
                        OnChange: =Set(varSRRemarks, Self.Text)
                        Placeholder: ="Add approval remarks..."
                        Type: =TextInputType.Multiline
            - SRDetActionRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =52
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnDetBack:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =ColorMuted
                        Height: =40
                        Icon: =Icon.ChevronLeft
                        OnSelect: =Navigate(SR_List, ScreenTransition.UnCover)
                        Text: ="Back"
                        Width: =120
                  - DetSpacer:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorMuted
                        FillPortions: =1
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =""
                        Wrap: =false
                  - btnDetEdit:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ColorPrimary
                        FillPortions: =0
                        Height: =40
                        Visible: |=varCanEdit
                        OnSelect: |=Set(gblFormMode, "Edit");
                          Navigate(SR_New, ScreenTransition.Fade)
                        Text: ="✏️ Edit"
                        Width: =100
                  - btnDetApprove:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorApproved
                        FillPortions: =0
                        Height: =40
                        Visible: |=varCanApprove
                        OnSelect: |=Set(varNextStage,
                            Switch(
                              varCurrentStatus,
                              "Submitted", "EndorsedHOD",
                              "EndorsedHOD", "ApprovedHR",
                              "ApprovedHR", "ApprovedCOO",
                              "ApprovedCOO", "ApprovedED",
                              "Closed"
                            )
                          );
                          IfError(
                            Patch(
                              MainDB_HR,
                              varCurrentItem,
                              { CurrentStatus: varNextStage }
                            );
                            Patch(
                              ApprovalHistoryHR,
                              Defaults(ApprovalHistoryHR),
                              {
                                ParentID: gblActiveRecordID,
                                FormCode: "SR",
                                Action: "Approved",
                                Stage: varNextStage,
                                ActionByEmail: gblCurrentUser,
                                ActionByName: gblCurrentUser,
                                ActionDate: Now(),
                                NextStage: varNextStage,
                                Comments: varSRRemarks,
                                Title: "Approved - " & varNextStage
                              }
                            );
                            Notify("Approved to " & varNextStage, NotificationType.Success);
                            Refresh(MainDB_HR);
                            Navigate(SR_List, ScreenTransition.UnCover),
                            Notify("Approval failed: " & FirstError.Message, NotificationType.Error)
                          )
                        Text: ="✅ Approve"
                        Width: =140
