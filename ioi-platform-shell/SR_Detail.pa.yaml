                        - SRDetColDateReq:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                            Children:
                              - LblDetDateReqLabel:
                                  Control: ModernText
                                  Properties:
                                    Color: =ColorMuted
                                    Height: =18
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
