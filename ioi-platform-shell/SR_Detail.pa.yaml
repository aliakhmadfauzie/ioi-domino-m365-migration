Screens:
  SR_Detail:
    Properties:
      Fill: =ColorBg
      OnVisible: |=Set(gblActiveFormCode, "SR");
        Set(gblActiveDept, "HR");
        Set(varCurrentItem, LookUp(MainDB_HR, ID = gblActiveRecordID));
        Set(varCurrentStatus, Coalesce(varCurrentItem.CurrentStatus, "Draft"));
        Set(varCanEdit, varCurrentStatus = "Draft" || varCurrentStatus = "Returned");
        Set(varCanApprove, varCurrentStatus = "Submitted" || varCurrentStatus = "EndorsedHOD" || varCurrentStatus = "ApprovedHR" || varCurrentStatus = "ApprovedCOO");
        Set(varCanReturn, varCurrentStatus = "Submitted" || varCurrentStatus = "EndorsedHOD" || varCurrentStatus = "ApprovedHR");
        ClearCollect(colSRHistory, Filter(ApprovalHistoryHR, ParentID = gblActiveRecordID, FormCode = "SR"));
        Set(varSRRemarks, "");
        Set(varNextStage, "")
    Children:
      - SRDetRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - SRDetHeader:
                Control: Header
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =ColorPrimary
                  Height: =64
                  Style: ='Header.Style'.Primary
                  Title: ="Staff Requisition Detail"
                  UserName: =gblCurrentUser
            - SRDetTopRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnBackSRDet:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =ColorPrimary
                        Height: =40
                        Icon: =Icon.ArrowLeft
                        OnSelect: =Navigate(SR_List, ScreenTransition.UnCover)
                        Text: ="Back"
                        Width: =100
                  - txtSRDetTitle:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =ColorText
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: |=Coalesce(varCurrentItem.Title, "Staff Requisition")
                        Wrap: =false
                  - badgeSRDetStatus:
                      Control: Badge
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        Content: =varCurrentStatus
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: |=Switch(
                            varCurrentStatus,
                            "Draft", 'BadgeCanvas.ThemeColor'.Informative,
                            "Submitted", 'BadgeCanvas.ThemeColor'.Warning,
                            "EndorsedHOD", 'BadgeCanvas.ThemeColor'.Warning,
                            "ApprovedHR", 'BadgeCanvas.ThemeColor'.Success,
                            "ApprovedCOO", 'BadgeCanvas.ThemeColor'.Success,
                            "ApprovedED", 'BadgeCanvas.ThemeColor'.Success,
                            "Rejected", 'BadgeCanvas.ThemeColor'.Error,
                            "Returned", 'BadgeCanvas.ThemeColor'.Warning,
                            'BadgeCanvas.ThemeColor'.Informative
                          )
                        Width: =130
            - SRDetRecordInfo:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.Small
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =50
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblSRDetCreated:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =ColorMuted
                        FillPortions: =0
                        Height: =26
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |="Created: " & Text(Coalesce(varCurrentItem.SubmittedDate, varCurrentItem.Created, Now()), "dd-mmm-yyyy")
                        Wrap: =false
                  - lblSRDetBy:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =ColorMuted
                        FillPortions: =1
                        Height: =26
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |="By: " & Coalesce(varCurrentItem.EmployeeName, varCurrentItem.SubmittedBy, varCurrentItem.Author.DisplayName, "—")
                        Wrap: =false
            - SRDetPositionCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.Regular
                  Fill: =ColorSurface
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - lblSRDetSection1:
                      Control: ModernText
