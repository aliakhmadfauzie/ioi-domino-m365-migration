                              - LblDetHeadcountLabel:
                                  Control: ModernText
                                  Properties:
                                    Color: =ColorMuted
                                    Height: =18
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
