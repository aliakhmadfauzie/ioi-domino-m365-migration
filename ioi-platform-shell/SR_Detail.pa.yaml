                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: |=Switch(
                                varCurrentStatus,
                                "EndorsedHOD", ColorPending,
                                "ApprovedHR", ColorApproved,
                                "ApprovedCOO", ColorApproved,
                                "ApprovedED", ColorApproved,
                                "Rejected", ColorRejected,
                                ColorMuted
                              )
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: |=If(varCurrentStatus = "Draft" || varCurrentStatus = "Submitted" || varCurrentStatus = "Returned", "○", "●")
                              Width: =24
                              Wrap: =false
                        - lblStage3:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorText
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="HR Review"
                              Width: =100
                              Wrap: =false
                        - lblStage3Status:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorMuted
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |=Switch(
                                varCurrentStatus,
                                "EndorsedHOD", "Pending…",
                                "ApprovedHR", "✅ Approved",
                                "ApprovedCOO", "✅ Approved",
                                "Rejected", "Rejected",
                                "—"
                              )
                              Wrap: =false
                  - SRDetApprovalRow4:
                      Control: GroupContainer
