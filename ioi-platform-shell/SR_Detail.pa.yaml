                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =44
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - dotStage4:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: |=Switch(
                                varCurrentStatus,
                                "ApprovedHR", ColorPending,
                                "ApprovedCOO", ColorApproved,
                                "ApprovedED", ColorApproved,
                                "Rejected", ColorRejected,
                                ColorMuted
                              )
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: |=If(varCurrentStatus = "Draft" || varCurrentStatus = "Submitted" || varCurrentStatus = "EndorsedHOD" || varCurrentStatus = "Returned", "○", "●")
                              Width: =24
                              Wrap: =false
                        - lblStage4:
