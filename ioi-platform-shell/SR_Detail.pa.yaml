                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorPrimary
                        FillPortions: =0
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
