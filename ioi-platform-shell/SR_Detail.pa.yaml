                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: |=Text(Coalesce(varCurrentItem.Headcount, varCurrentItem.Quantity, 1), "#")
