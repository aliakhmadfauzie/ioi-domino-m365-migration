                                    Color: =ColorText
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: |=Text(Coalesce(varCurrentItem.DateRequired, varCurrentItem.TargetDate, varCurrentItem.RequestedDate, varCurrentItem.SubmittedDate), "dd-mmm-yyyy")
                                    Wrap: =false
                  - LblDetReasonLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =18
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Justification"
                        Wrap: =false
                  - LblDetReasonVal:
                      Control: ModernText
                      Properties:
                        Color: =ColorText
                        FillPortions: =0
                        Height: =60
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |=Coalesce(varCurrentItem.Reason, varCurrentItem.Justification, varCurrentItem.Remarks, varCurrentItem.Comments, "No justification provided.")
                        Wrap: =true
            - SRDetApprovalCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.Regular
                  Fill: =ColorSurface
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - lblSRDetApproval:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorPrimary
                        FillPortions: =0
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Approval Timeline"
                        Wrap: =false
                  - SRDetApprovalRow1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =44
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - dotStage1:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorApproved
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
