Screens:
  SR_List:
    Properties:
      Fill: =ColorBg
      OnVisible: =|
        Set(gblActiveFormCode,"SR");
        Set(gblActiveDept, "HR");
        Set(varSRTab, "all")
    Children:
      - SRListRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - SRListHeader:
                Control: Header
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =ColorPrimary
                  Height: =64
                  Style: ='Header.Style'.Primary
                  Title: ="Staff Requisitions"
                  UserName: =gblCurrentUser
            - SRListSubheader:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorMuted
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: ="Request new headcount or replacement staff — " & gblActiveSite
                  Wrap: =false
            - SRListActionRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnBackSR:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =ColorPrimary
                        Icon: =Icon.ArrowLeft
                        OnSelect: =Navigate(HR_Home, ScreenTransition.UnCover)
                        Text: ="Back"
                        Width: =100
                  - txtSearchSR:
                      Control: ModernTextInput
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =Appearance.Outline
                        FillPortions: =1
                        Placeholder: ="Search by title or position..."
                        Type: =TextInputType.Search
                  - btnRefreshSR:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ColorPrimary
                        Height: =40
                        Icon: =Icon.Refresh
                        OnSelect: =Refresh(MainDB_HR)
                        Text: ="Refresh"
                        Width: =100
                  - btnNewSR:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorAccent
                        Height: =40
                        OnSelect: =Navigate(SR_New, ScreenTransition.Fade)
                        Text: ="New Requisition"
                        Width: =150
            - SRListTabRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - tabAll:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =If(varSRTab = "all", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ColorPrimary
                        Height: =34
                        OnSelect: =Set(varSRTab, "all")
                        Text: ="All"
                        Width: =80
                  - tabDraft:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =If(varSRTab = "Draft", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ColorPrimary
                        Height: =34
                        OnSelect: =Set(varSRTab, "Draft")
                        Text: ="Draft"
                        Width: =80
                  - tabSubmitted:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =If(varSRTab = "Submitted", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ColorPrimary
                        Height: =34
                        OnSelect: =Set(varSRTab, "Submitted")
                        Text: ="Pending HOD"
                        Width: =110
                  - tabApproved:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =If(varSRTab = "Approved", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ColorPrimary
                        Height: =34
                        OnSelect: =Set(varSRTab, "Approved")
                        Text: ="Approved"
                        Width: =100
            - SRListCount:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorMuted
                  FillPortions: =0
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: |=Text(CountRows(SRListGallery.AllItems)) & " record(s)"
                  Wrap: =false
            - SRListGallery:
                Control: Gallery
                Variant: Vertical
                Properties:
                  FillPortions: =1
                  Height: =400
                  Items: |=Filter(
                      MainDB_HR,
                      FormType = "SR",
                      (varSRTab = "all" || CurrentStatus = varSRTab || (varSRTab = "Approved" && (CurrentStatus = "ApprovedHR" || CurrentStatus = "ApprovedCOO" || CurrentStatus = "ApprovedED"))),
                      (IsBlank(txtSearchSR.Text) ||
                        StartsWith(Title, txtSearchSR.Text) ||
                        StartsWith(VacancyTitle, txtSearchSR.Text) ||
                        StartsWith(Department, txtSearchSR.Text))
                    )
                  ShowScrollbar: =true
                  TemplatePadding: =8
                  TemplateSize: =80
                Children:
                  - cardSRRow:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Fill: =ColorSurface
                        Height: =Parent.TemplateHeight
                        OnSelect: |=Set(gblActiveRecordID, ThisItem.ID);
                          Set(varCurrentStatus, ThisItem.CurrentStatus);
                          Navigate(SR_Detail, ScreenTransition.Fade)
                        Width: =Parent.TemplateWidth
                  - txtSRTitle:
                      Control: ModernText
                      Properties:
                        Color: =ColorText
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =15
                        Text: =ThisItem.Title
                        Wrap: =false
                        X: =16
                        Y: =10
                  - txtSRDescription:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =Coalesce(ThisItem.VacancyTitle, ThisItem.Reason, "Staff requisition")
                        Wrap: =false
                        X: =16
                        Y: =36
                  - txtSRDept:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =ThisItem.Department
                        Wrap: =false
                        X: =16
                        Y: =56
                  - badgeSRStatus:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        Content: =ThisItem.CurrentStatus
                        Height: =26
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: |=Switch(
                            ThisItem.CurrentStatus,
                            "Draft", 'BadgeCanvas.ThemeColor'.Informative,
                            "Submitted", 'BadgeCanvas.ThemeColor'.Warning,
                            "EndorsedHOD", 'BadgeCanvas.ThemeColor'.Warning,
                            "ApprovedHR", 'BadgeCanvas.ThemeColor'.Success,
                            "ApprovedCOO", 'BadgeCanvas.ThemeColor'.Success,
                            "ApprovedED", 'BadgeCanvas.ThemeColor'.Success,
                            "Rejected", 'BadgeCanvas.ThemeColor'.Error,
                            "Returned", 'BadgeCanvas.ThemeColor'.Warning,
                            'BadgeCanvas.ThemeColor'.Informative
                          )
                        Width: =110
                        X: =Parent.TemplateWidth - 130
                        Y: =14
