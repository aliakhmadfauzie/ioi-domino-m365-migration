Screens:
  SR_New:
    Properties:
      Fill: =ColorBg
      OnVisible: |=Set(varSR_CaseNo, "SR-" & Text(Now(), "yyyymmddhhmmss"));
        Set(gblActiveFormCode, "SR");
        Set(gblActiveDept, "HR");
        Set(varSR_Saved, false);
        Set(varSR_ParentRec, Blank());
        Set(varSR_IsSubmitting, false)
    Children:
      - SRNewRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - SRNewHeader:
                Control: Header
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =ColorPrimary
                  Height: =64
                  Style: ='Header.Style'.Primary
                  Title: ="New Staff Requisition"
                  UserName: =gblCurrentUser
            - SRNewSubheader:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorMuted
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: ="SR  •  HR  •  " & gblActiveSite
                  Wrap: =false
            - SRNewStatusRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - SRNewStatusBadge:
                      Control: Badge
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        Content: =If(varSR_Saved, "Draft", "New")
                        FillPortions: =0
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: ='BadgeCanvas.ThemeColor'.Informative
                        Width: =100
                  - SRNewProgress:
                      Control: Progress
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =1
                        Height: =12
                        Max: =4
                        ProgressColor: ='Progress.ProgressColor'.Brand
                        Shape: ='Progress.Shape'.Rounded
                        Thickness: ='Progress.Thickness'.Medium
                        Value: =0
                  - SRNewStageCaption:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =ColorMuted
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Stage 0 of 4"
                        Width: =120
                        Wrap: =false
            - SRNewFormCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.Regular
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =900
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - LblSRCaseNo:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorPrimary
                        FillPortions: =0
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Section 1 — Position Details"
                        Wrap: =false
                  - RowCaseNo:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =66
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - ColRefNo:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblRefNo:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Reference No."
                                    Wrap: =false
                              - txtRefNo:
                                  Control: ModernTextInput
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    Default: =varSR_CaseNo
                                    DisplayMode: =DisplayMode.View
                                    FillPortions: =0
                                    Height: =40
                        - ColSubmittedOn:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblSRDate:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Date"
                                    Wrap: =false
                              - txtSRDate:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    FillPortions: =0
                                    Height: =40
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Text(Now(), "yyyy-mm-dd hh:mm")
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                  - LblSRPosition:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorText
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Position *"
                        Wrap: =false
                  - txtSRPosition:
                      Control: ModernTextInput
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        FillPortions: =0
                        Height: =40
                        Placeholder: ="e.g. Senior Process Engineer"
                  - RowGradeDept:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =76
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - ColGrade:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblGrade:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Grade / Level"
                                    Wrap: =false
                              - txtSRGrade:
                                  Control: ModernTextInput
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    FillPortions: =0
                                    Height: =40
                                    Placeholder: ="e.g. E3, M2"
                        - ColDept:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblSRDept:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Department *"
                                    Wrap: =false
                              - drpSRDepartment:
                                  Control: ModernDropdown
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    FillPortions: =0
                                    Height: =40
                                    Default: ="Human Resources"
                                    ItemDisplayText: ="Value"
                                    Items: |=Table(
                                        {Value: "Human Resources"},
                                        {Value: "Finance"},
                                        {Value: "Information Technology"},
                                        {Value: "Production"},
                                        {Value: "Quality Assurance"},
                                        {Value: "Maintenance"},
                                        {Value: "Safety Health Environment"}
                                      )
                  - RowHeadcountRep:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =76
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - ColHeadcount:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblHeadcount:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Headcount"
                                    Wrap: =false
                              - txtSRHeadcount:
                                  Control: ModernTextInput
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    Default: ="1"
                                    FillPortions: =0
                                    Height: =40
                        - ColReplacement:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblReplacement:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Replacement For"
                                    Wrap: =false
                              - txtSRReplacement:
                                  Control: ModernTextInput
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    FillPortions: =0
                                    Height: =40
                                    Placeholder: ="Optional"
                  - RowDatePriority:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =76
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - ColDateRequired:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblDateRequired:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Date Required"
                                    Wrap: =false
                              - dtpSRDateRequired:
                                  Control: ModernDatePicker
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    FillPortions: =0
                                    Height: =40
                        - ColPriority:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - LblSRPriority:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorText
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="Priority"
                                    Wrap: =false
                              - drpSRPriority:
                                  Control: ModernDropdown
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    Default: ="Medium"
                                    FillPortions: =0
                                    Height: =40
                                    ItemDisplayText: ="Value"
                                    Items: |=Table(
                                        {Value: "Low"},
                                        {Value: "Medium"},
                                        {Value: "High"},
                                        {Value: "Urgent"}
                                      )
                  - LblSRReason:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorText
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Reason / Justification *"
                        Wrap: =false
                  - txtSRReason:
                      Control: ModernTextInput
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        FillPortions: =0
                        Height: =100
                        Placeholder: ="Describe the business justification for this headcount..."
                        Type: =TextInputType.Multiline
            - SRNewActionRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =48
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnBackSRNew:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =ColorMuted
                        Height: =40
                        Icon: =Icon.ChevronLeft
                        OnSelect: =Navigate(SR_List, ScreenTransition.UnCover)
                        Text: ="Back"
                        Width: =120
                  - ActionSpacerSR:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorMuted
                        FillPortions: =1
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =""
                        Wrap: =false
                  - btnSRSaveDraft:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ColorPrimary
                        FillPortions: =0
                        Height: =40
                        OnSelect: |=IfError(
                            Set(varSR_IsSubmitting, true);
                            Set(
                              varSR_ParentRec,
                              Patch(
                                MainDB_HR,
                                Defaults(MainDB_HR),
                                {
                                  Title: varSR_CaseNo,
                                  FormType: "SR",
                                  CurrentStatus: "Draft",
                                  VacancyTitle: txtSRPosition.Text,
                                  JobDesignation: txtSRGrade.Text,
                                  Department: drpSRDepartment.Selected.Value,
                                  Headcount: Value(txtSRHeadcount.Text),
                                  Priority: drpSRPriority.Selected.Value,
                                  DateRequired: dtpSRDateRequired.SelectedDate,
                                  Reason: txtSRReason.Text,
                                  EmployeeID: User().Email,
                                  EmployeeName: User().FullName,
                                  SubmittedDate: Now(),
                                  EnvironmentTag: "PROD"
                                }
                              )
                            );
                            Set(varSR_Saved, true);
                            Set(varSR_IsSubmitting, false);
                            Notify("Draft saved — " & varSR_CaseNo, NotificationType.Success),
                            Set(varSR_IsSubmitting, false);
                            Notify("Save failed: " & FirstError.Message, NotificationType.Error)
                          )
                        Text: ="Save Draft"
                        Width: =140
                  - btnSRSubmit:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorAccent
                        FillPortions: =0
                        DisplayMode: |=If(
                            IsBlank(txtSRPosition.Text) ||
                            IsBlank(drpSRDepartment.Selected.Value) ||
                            IsBlank(txtSRReason.Text) ||
                            Len(txtSRReason.Text) < 10 ||
                            varSR_IsSubmitting,
                            DisplayMode.Disabled,
                            DisplayMode.Edit
                          )
                        Height: =40
                        OnSelect: |=IfError(
                            Set(varSR_IsSubmitting, true);
                            Set(
                              varSR_ParentRec,
                              Patch(
                                MainDB_HR,
                                Defaults(MainDB_HR),
                                {
                                  Title: varSR_CaseNo,
                                  FormType: "SR",
                                  CurrentStatus: "Submitted",
                                  VacancyTitle: txtSRPosition.Text,
                                  JobDesignation: txtSRGrade.Text,
                                  Department: drpSRDepartment.Selected.Value,
                                  Headcount: Value(txtSRHeadcount.Text),
                                  Priority: drpSRPriority.Selected.Value,
                                  DateRequired: dtpSRDateRequired.SelectedDate,
                                  Reason: txtSRReason.Text,
                                  EmployeeID: User().Email,
                                  EmployeeName: User().FullName,
                                  SubmittedDate: Now(),
                                  EnvironmentTag: "PROD"
                                }
                              )
                            );
                            Patch(
                              ApprovalHistoryHR,
                              Defaults(ApprovalHistoryHR),
                              {
                                Title: "Submitted",
                                ParentID: varSR_ParentRec.ID,
                                FormCode: "SR",
                                StageNumber: 1,
                                Action: "Submitted",
                                ActionByEmail: User().Email,
                                ActionByName: User().FullName,
                                ActionDate: Now(),
                                NextStage: "EndorsedHOD",
                                Comments: "Submitted for HOD approval"
                              }
                            );
                            Set(varSR_Saved, true);
                            Set(gblActiveRecordID, varSR_ParentRec.ID);
                            Set(varSR_IsSubmitting, false);
                            Notify("Submitted " & varSR_CaseNo & " for HOD approval.", NotificationType.Success);
                            Navigate(SR_Detail, ScreenTransition.Fade),
                            Set(varSR_IsSubmitting, false);
                            Notify("Submit failed: " & FirstError.Message, NotificationType.Error)
                          )
                        Text: ="Submit"
                        Width: =140
