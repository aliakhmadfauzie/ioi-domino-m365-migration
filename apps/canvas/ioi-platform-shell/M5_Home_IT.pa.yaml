Screens:
  M5_Home_IT:
    Properties:
      Fill: '=Coalesce(gblAppColors.GrayLight, ColorValue("#F8F9FA"))  '
      Height: =App.Height
      OnVisible: |-
        =Set(varCurrentScreen, "M5_Home_IT");
        Set(gblITTheme, Coalesce(gblITTheme, {Name: "IT", PrimaryColor: ColorValue("#0062E6"), SecondaryColor: ColorValue("#1E3A5F"), AccentColor: ColorValue("#0891B2"), LightBg: ColorValue("#F8FAFC"), SuccessColor: ColorValue("#16A34A"), WarningColor: ColorValue("#D97706"), DangerColor: ColorValue("#DC2626"), NavHeaderBg: ColorValue("#0062E6"), NeutralColor: ColorValue("#64748B"), TextPrimary: ColorValue("#0F172A"), TextSecondary: ColorValue("#475569"), NavHeaderText: ColorValue("#FFFFFF"), Tagline: "Powering Digital Solutions"}));
        Set(varListLoading, true);
        Set(varHomeNavOpen, false);
        Set(varListFilterStatus, "All");
        Set(varListSearchText, "");
        Set(varCurrentDepartment, "IT");
        Set(varCurrentModuleCode, "M5");
        ClearCollect(
          colM5ModuleRecords_IT,
          ForAll(
            Sequence(12),
            {
              ID: Value,
              DocRef: "M5-IT-" & Text(Value, "000"),
              SubmittedDate: Text(DateAdd(Today(), -Value, TimeUnit.Days), "yyyy-mm-dd"),
              RefDetail: "IT system audit record " & Text(Value),
              StageLabel: If(Mod(Value,4)=0, "Completed", If(Mod(Value,3)=0, "Pending Approval", If(Mod(Value,2)=0, "In Progress", "Draft")))
            }
          )
        );
        Set(varListLoading, false)
      Width: =App.Width
    Children:
      - ModuleListRoot_M5_IT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =gblAppColors.GrayLight
