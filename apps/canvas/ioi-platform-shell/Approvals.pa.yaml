Screens:
  Approvals:
    Properties:
      Fill: =ColorBg
      OnVisible: =Set(gblCurrentUser, Coalesce(gblCurrentUser, User().FullName))
    Children:
      - rootApprovals:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - rowApprovalsTitle:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnApprovalsBack:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =ColorPrimary
                        Height: =40
                        Icon: =Icon.Home
                        OnSelect: =Navigate(Home, ScreenTransition.UnCover)
                        Text: ="Home"
                        Width: =110
                  - txtApprovalsTitle:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =ColorText
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =24
                        Text: ="Approvals"
                        Wrap: =false
                  - badgePendingCount:
                      Control: Badge
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        Content: =Text(CountRows(Filter(colApprovals, Status = "Pending"))) & " pending"
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: ='BadgeCanvas.ThemeColor'.Warning
                        Width: =130
            - galApprovals:
                Control: Gallery
                Variant: Vertical
                Properties:
                  FillPortions: =0
                  Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                  Items: =SortByColumns(colApprovals, "SubmittedOn", SortOrder.Descending)
                  TemplatePadding: =8
                  TemplateSize: =210
                Children:
                  - cardApproval:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Description: ="Submitted " & Text(ThisItem.SubmittedOn, "mmm d, yyyy")
                        DescriptionColor: =ColorMuted
                        Fill: =ColorSurface
                        HeaderImage: =""
                        Height: =194
                        Image: =""
                        Subtitle: =ThisItem.FormCode & " • " & ThisItem.SubmittedBy
                        SubtitleColor: =ColorMuted
                        SubtitleSize: =13
                        Title: =ThisItem.Title
                        TitleColor: =ColorText
                        Width: =Parent.TemplateWidth - 24
                  - progApprovalStage:
                      Control: Progress
                      Properties:
                        Height: =8
                        Max: =ThisItem.TotalStages
                        ProgressColor: ='Progress.ProgressColor'.Brand
                        Shape: ='Progress.Shape'.Rounded
                        Thickness: ='Progress.Thickness'.Medium
                        Value: =ThisItem.CurrentStage
                        Width: =Parent.TemplateWidth - 56
                        X: =16
                        Y: =96
                  - txtApprovalStage:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Stage " & Text(ThisItem.CurrentStage) & " of " & Text(ThisItem.TotalStages)
                        Width: =200
                        Wrap: =false
                        X: =16
                        Y: =108
                  - badgeApprovalStatus:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Filled
                        Content: =ThisItem.Status
                        Height: =28
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: =Switch(ThisItem.Status, "Approved", 'BadgeCanvas.ThemeColor'.Success, "Rejected", 'BadgeCanvas.ThemeColor'.Danger, 'BadgeCanvas.ThemeColor'.Warning)
                        Width: =100
                        X: =Parent.TemplateWidth - 130
                        Y: =104
                  - txtApprovalComment:
                      Control: ModernTextInput
                      Properties:
                        Appearance: =Appearance.Outline
                        DisplayMode: =If(ThisItem.Status = "Pending", DisplayMode.Edit, DisplayMode.Disabled)
                        Height: =40
                        Placeholder: ="Add a comment..."
                        Width: =Parent.TemplateWidth - 56
                        X: =16
                        Y: =136
                  - btnApprove:
                      Control: ModernButton
                      Properties:
                        BasePaletteColor: =ColorApproved
                        DisplayMode: =If(ThisItem.Status = "Pending", DisplayMode.Edit, DisplayMode.Disabled)
                        Height: =40
                        OnSelect: |-
                          =Patch(colApprovals, ThisItem, {Status: "Approved"});
                          Notify("Approved " & ThisItem.FormCode, NotificationType.Success)
                        Text: ="Approve"
                        Width: =140
                        X: =16
                        Y: =170
                  - btnReject:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ColorRejected
                        DisplayMode: =If(ThisItem.Status = "Pending", DisplayMode.Edit, DisplayMode.Disabled)
                        Height: =40
                        OnSelect: |-
                          =Patch(colApprovals, ThisItem, {Status: "Rejected"});
                          Notify("Rejected " & ThisItem.FormCode, NotificationType.Error)
                        Text: ="Reject"
                        Width: =140
                        X: =168
                        Y: =170
