App:
  Properties:
    Formulas: "=// ============================================================\n        // APP.FORMULAS — All reactive, no Set() needed anywhere below\n        // Screens bind directly to these named formulas.\n        // When gblThemeMode or gblUserRole changes via Set(), every\n        // formula that references them below re-evaluates automatically.\n        // ============================================================\n\n        /* ── 1. User identity (pure signal — never needs Set) ── */\n        \n\n        /* ── 2. Device classification with OS override ──\n           Priority order:\n             a) Width >= 1200 AND NOT iOS/Android  → Desktop\n             b) Width >= 1200 AND iOS/Android       → LargeTablet\n             c) Width >= 600                        → Tablet\n             d) Width <  600                        → Phone          */\n        fxDeviceType =\n            If(\n                App.Width >= 1200 && !(Host.OSType = \"iOS\" || Host.OSType = \"Android\"),\n                \"Desktop\",\n                App.Width >= 1200,\n                \"LargeTablet\",\n                App.Width >= 600,\n                \"Tablet\",\n                \"Phone\"\n            );\n\n        /* ── 3. Convenience booleans ── */\n        fxIsPhone       = fxDeviceType = \"Phone\";\n        fxIsTablet      = fxDeviceType = \"Tablet\";\n        fxIsLargeTablet = fxDeviceType = \"LargeTablet\";\n        fxIsDesktop     = fxDeviceType = \"Desktop\";\n\n        /* True for any layout that is NOT a full desktop window */\n        fxIsMobileLayout = !fxIsDesktop;\n\n        /* True when the device should use touch-optimised spacing */\n        fxUseTouchUI =\n            Host.OSType = \"iOS\" ||\n            Host.OSType = \"Android\" ||\n            fxIsMobileLayout;\n\n        /* ── 4. Sidebar / navigation helpers ── */\n        /* Persistent side nav shown on Desktop and LargeTablet */\n        fxSidebarPersistent = fxIsDesktop || fxIsLargeTablet;\n        fxSidebarWidth =\n            If(\n                fxSidebarPersistent,\n                Max(220, App.Width * 0.18),\n                App.Width\n            );\n\n        /* ── 5. Layout spacing helpers ── */\n        fxHeaderHeight        = If(fxIsPhone, 68, 80);\n        fxBodyPadding         = If(fxIsPhone, 8, 12);\n        fxLayoutGap           = If(fxIsPhone, 8, 14);\n        fxPanelPadding        = If(fxIsPhone, 10, 12);\n        fxBorderRadius        = 8;\n\n        /* ── 6. Gallery / list touch helpers ── */\n        fxGalleryTemplateSize = If(fxIsPhone, 108, 88);\n        fxGalleryPadding      = If(fxUseTouchUI, 6, 4);\n        fxListItemHeight      = If(fxUseTouchUI, 44, 32);\n\n        /* ── 7. Typography helpers ── */\n        fxFontSizeBody        = If(fxIsPhone, 9, 10);\n        fxFontSizeCaption     = If(fxIsPhone, 8.5, 9);\n        fxFontSizeTitle       = If(fxIsPhone, 13, If(fxIsTablet, 16, 18));\n        fxFontSizeSubtitle    = If(fxIsPhone, 9, 10);\n\n        /* ── 8. Role-based palette — reactive to gblUserRole ── */\n        gblRolePrimary1Dark  = Switch(gblUserRole, \"Approver\", ColorValue(\"#A78BFA\"), \"HOD\", ColorValue(\"#FDBA74\"), \"Requester\", ColorValue(\"#5EEAD4\"), \"Admin\", ColorValue(\"#4D94FF\"), ColorValue(\"#4D94FF\"));\n        gblRolePrimary2Dark  = Switch(gblUserRole, \"Approver\", ColorValue(\"#C084FC\"), \"HOD\", ColorValue(\"#F59E0B\"), \"Requester\", ColorValue(\"#2DD4BF\"), \"Admin\", ColorValue(\"#00FF88\"), ColorValue(\"#00FF88\"));\n        gblRolePrimary1Light = Switch(gblUserRole, \"Approver\", ColorValue(\"#6D28D9\"), \"HOD\", ColorValue(\"#C2410C\"), \"Requester\", ColorValue(\"#0F766E\"), \"Admin\", ColorValue(\"#003366\"), ColorValue(\"#003366\"));\n        gblRolePrimary2Light = Switch(gblUserRole, \"Approver\", ColorValue(\"#8B5CF6\"), \"HOD\", ColorValue(\"#EA580C\"), \"Requester\", ColorValue(\"#14B8A6\"), \"Admin\", ColorValue(\"#00A859\"), ColorValue(\"#00A859\"));\n\n        /* ── 9. App-wide theme record — reactive to gblThemeMode + gblUserRole ──\n           Controls bind to gblAppColors.Primary1 etc. as before.\n           Theme toggle buttons now only need: Set(gblThemeMode, \"Dark\"/\"Light\")\n           — no second Set(gblAppColors, ...) required anywhere.           */\n        gblAppColors =\n            If(\n                gblThemeMode = \"Dark\",\n                {\n                    Primary1:  gblRolePrimary1Dark,\n                    Primary2:  gblRolePrimary2Dark,\n                    GrayDark:  ColorValue(\"#E9ECEF\"),\n                    GrayLight: ColorValue(\"#121212\"),\n                    White:     ColorValue(\"#1E1E1E\"),\n                    Success:   ColorValue(\"#00FF88\"),\n                    Warning:   ColorValue(\"#FBBF24\")\n                },\n                {\n                    Primary1:  gblRolePrimary1Light,\n                    Primary2:  gblRolePrimary2Light,\n                    GrayDark:  ColorValue(\"#212529\"),\n                    GrayLight: ColorValue(\"#F8F9FA\"),\n                    White:     ColorValue(\"#FFFFFF\"),\n                    Success:   ColorValue(\"#00A859\"),\n                    Warning:   ColorValue(\"#FFC107\")\n                }\n            );\n            // ===== IOI Platform Shell — Shared Palette (single source of truth) =====\n      // Clean & Professional: deep teal-navy primary, teal accent, neutral surfaces.\n      ColorBg = RGBA(245, 247, 249, 1);\n      ColorSurface = RGBA(255, 255, 255, 1);\n      ColorPrimary = RGBA(20, 78, 102, 1);\n      ColorAccent = RGBA(0, 153, 153, 1);\n      ColorText = RGBA(28, 37, 46, 1);\n      ColorMuted = RGBA(110, 122, 134, 1);\n      ColorPending = RGBA(217, 138, 12, 1);\n      ColorApproved = RGBA(34, 139, 87, 1);\n      ColorRejected = RGBA(200, 64, 60, 1);\n\n      // Status color resolver for Badge/Progress tinting.\n      StatusColor(status: Text): Color =\n        Switch(\n          status,\n          \"Approved\", ColorApproved,\n          \"Rejected\", ColorRejected,\n          ColorPending\n        );"
    OnStart: "=// ============================================\n        // APP ONSTART — MUTABLE SESSION STATE ONLY\n        // ============================================\n        // gblUserEmail, gblAppColors, gblRolePrimary* are now reactive named\n        // formulas in App.Formulas and must NOT be Set() here.\n        // Full data bootstrap stays in WelcomeInitializationScreen.OnVisible.\n\n        // ── Site preference (mutable — user can change) ──\n        Set(varUserSite, Coalesce(varUserSite, \"Johor\"));\n\n        // ── Theme mode (mutable — user can toggle via button) ──\n        Set(gblThemeMode, Coalesce(gblThemeMode, \"Light\"));\n\n        // ── Role / security (mutable — resolved in WelcomeInitializationScreen) ──\n        Set(gblSecurityRole, Coalesce(gblSecurityRole, \"ReadOnly\"));\n        Set(gblUserRole,     Coalesce(gblUserRole, \"User\"));\n        Set(gblRoleDisplay,  Coalesce(gblRoleDisplay, \"General User\"));\n\n        // ── Startup / loading flags ──\n        Set(gblDemoMode, Coalesce(gblDemoMode, false));\n        Set(varDemoCurrentSeq, Coalesce(varDemoCurrentSeq, 1));\n        Set(varDemoAutoNavigate, false);\n        Set(varDemoFilterModule, Coalesce(varDemoFilterModule, \"ALL\"));\n        Set(varDemoSearchText, Coalesce(varDemoSearchText, \"\"));\n        Set(varStartupNavigated, false);\n        Set(varLoadingComplete,  false);\n        Set(varInitProgress,     0);\n        Set(varInitStatusText,   \"Starting initialization...\");\n        Set(varRecordID,         Param(\"RecordID\"));\n        Set(varHeartbeatHealthy, Coalesce(varHeartbeatHealthy, true));\n        // ===== Global state contract =====\n      Set(gblActiveSite, \"Johor\");\n      Set(gblActiveDept, Blank());\n      Set(gblActiveFormCode, Blank());\n      Set(gblActiveRecordID, 0);\n      Set(gblFormMode, \"New\");\n      Set(gblCurrentUser, User().FullName);\n\n      // ===== HR theme (moved from App.Formulas — Set() is not valid in named formulas) =====\n      Set(gblHRTheme, Coalesce(gblHRTheme, {AccentColor: ColorValue(\"#0078D4\"), DangerColor: ColorValue(\"#DC2626\"), LightBg: ColorValue(\"#F0F4FF\"), Name: \"HR\", NavHeaderBg: ColorValue(\"#0F2558\"), NavHeaderText: ColorValue(\"#FFFFFF\"), NeutralColor: ColorValue(\"#64748B\"), PrimaryColor: ColorValue(\"#1D4ED8\"), SecondaryColor: ColorValue(\"#F3F2F1\"), SuccessColor: ColorValue(\"#16A34A\"), Tagline: \"People First\", TextPrimary: ColorValue(\"#0F172A\"), TextSecondary: ColorValue(\"#475569\"), WarningColor: ColorValue(\"#D97706\")}));\n\n      // ===== Mock collection: Sites (mirrors site dimension) =====\n      ClearCollect(\n        colSites,\n        { Site: \"Johor\", FormCount: 129 },\n        { Site: \"Prai\", FormCount: 232 }\n      );\n\n      // ===== Mock collection: Departments (MainDB_{DEPT} parents) =====\n      ClearCollect(\n        colDepartments,\n        { DeptCode: \"FIN\", DeptName: \"Finance\", Site: \"Johor\", FormCount: 22 },\n        { DeptCode: \"HR\", DeptName: \"Human Resources\", Site: \"Johor\", FormCount: 18 },\n        { DeptCode: \"IT\", DeptName: \"Information Technology\", Site: \"Johor\", FormCount: 15 },\n        { DeptCode: \"SHE\", DeptName: \"Safety Health Environment\", Site: \"Johor\", FormCount: 24 },\n        { DeptCode: \"PRD\", DeptName: \"Production\", Site: \"Johor\", FormCount: 31 },\n        { DeptCode: \"STR\", DeptName: \"Stores\", Site: \"Prai\", FormCount: 27 },\n        { DeptCode: \"EI\", DeptName: \"Engineering Instrumentation\", Site: \"Prai\", FormCount: 19 },\n        { DeptCode: \"QA\", DeptName: \"Quality Assurance\", Site: \"Prai\", FormCount: 16 },\n        { DeptCode: \"PUR\", DeptName: \"Purchasing\", Site: \"Prai\", FormCount: 14 },\n        { DeptCode: \"MTN\", DeptName: \"Maintenance\", Site: \"Prai\", FormCount: 21 }\n      );\n\n      // ===== Mock collection: Forms (FormCode discriminator across MainDB_{DEPT}) =====\n      ClearCollect(\n        colForms,\n        { FormCode: \"FIN-PV-001\", Title: \"Payment Voucher\", DeptCode: \"FIN\", Site: \"Johor\", Pattern: \"Standard form\", ApprovalStages: 3 },\n        { FormCode: \"FIN-CL-002\", Title: \"Cash Advance Claim\", DeptCode: \"FIN\", Site: \"Johor\", Pattern: \"Standard form\", ApprovalStages: 2 },\n        { FormCode: \"HR-LV-002\", Title: \"Leave Application\", DeptCode: \"HR\", Site: \"Johor\", Pattern: \"Standard form\", ApprovalStages: 2 },\n        { FormCode: \"HR-OT-005\", Title: \"Overtime Request\", DeptCode: \"HR\", Site: \"Johor\", Pattern: \"Editable gallery\", ApprovalStages: 3 },\n        { FormCode: \"ITSSR\", Title: \"IT Support & Service Request\", DeptCode: \"IT\", Site: \"Johor\", Pattern: \"Standard form\", ApprovalStages: 2 },\n        { FormCode: \"IT-SAP-ACC\", Title: \"SAP Access Request\", DeptCode: \"IT\", Site: \"Johor\", Pattern: \"Standard form\", ApprovalStages: 4 },\n        { FormCode: \"IT-HW-003\", Title: \"Hardware Request\", DeptCode: \"IT\", Site: \"Johor\", Pattern: \"Standard form\", ApprovalStages: 2 },\n        { FormCode: \"SHE-INC-001\", Title: \"Incident Report\", DeptCode: \"SHE\", Site: \"Johor\", Pattern: \"Standard form\", ApprovalStages: 3 },\n        { FormCode: \"SHE-PTW-004\", Title: \"Permit To Work\", DeptCode: \"SHE\", Site: \"Johor\", Pattern: \"Editable gallery\", ApprovalStages: 4 },\n        { FormCode: \"PRD-BR-001\", Title: \"Batch Record\", DeptCode: \"PRD\", Site: \"Johor\", Pattern: \"Editable gallery\", ApprovalStages: 3 },\n        { FormCode: \"PRD-DT-006\", Title: \"Downtime Log\", DeptCode: \"PRD\", Site: \"Johor\", Pattern: \"Editable gallery\", ApprovalStages: 2 },\n        { FormCode: \"STR-MR-001\", Title: \"Material Requisition\", DeptCode: \"STR\", Site: \"Prai\", Pattern: \"Standard form\", ApprovalStages: 3 },\n        { FormCode: \"STR-GRN-002\", Title: \"Goods Received Note\", DeptCode: \"STR\", Site: \"Prai\", Pattern: \"Editable gallery\", ApprovalStages: 2 },\n        { FormCode: \"EI-CAL-001\", Title: \"Calibration Record\", DeptCode: \"EI\", Site: \"Prai\", Pattern: \"Standard form\", ApprovalStages: 2 },\n        { FormCode: \"QA-NCR-003\", Title: \"Non-Conformance Report\", DeptCode: \"QA\", Site: \"Prai\", Pattern: \"Standard form\", ApprovalStages: 3 },\n        { FormCode: \"PUR-PR-001\", Title: \"Purchase Requisition\", DeptCode: \"PUR\", Site: \"Prai\", Pattern: \"Standard form\", ApprovalStages: 4 },\n        { FormCode: \"MTN-WO-002\", Title: \"Work Order\", DeptCode: \"MTN\", Site: \"Prai\", Pattern: \"Editable gallery\", ApprovalStages: 3 }\n      );\n\n      // ===== Mock collection: Approvals (approval inbox) =====\n      ClearCollect(\n        colApprovals,\n        { Id: 1, FormCode: \"FIN-PV-001\", Title: \"Payment Voucher\", SubmittedBy: \"Aisha Rahman\", SubmittedOn: DateValue(\"2026-06-08\"), CurrentStage: 2, TotalStages: 3, Status: \"Pending\" },\n        { Id: 2, FormCode: \"HR-LV-002\", Title: \"Leave Application\", SubmittedBy: \"Tan Wei Ming\", SubmittedOn: DateValue(\"2026-06-09\"), CurrentStage: 1, TotalStages: 2, Status: \"Pending\" },\n        { Id: 3, FormCode: \"IT-SAP-ACC\", Title: \"SAP Access Request\", SubmittedBy: \"Rajesh Kumar\", SubmittedOn: DateValue(\"2026-06-07\"), CurrentStage: 3, TotalStages: 4, Status: \"Pending\" },\n        { Id: 4, FormCode: \"SHE-INC-001\", Title: \"Incident Report\", SubmittedBy: \"Nurul Huda\", SubmittedOn: DateValue(\"2026-06-10\"), CurrentStage: 1, TotalStages: 3, Status: \"Pending\" },\n        { Id: 5, FormCode: \"STR-MR-001\", Title: \"Material Requisition\", SubmittedBy: \"Lim Chee Keong\", SubmittedOn: DateValue(\"2026-06-05\"), CurrentStage: 3, TotalStages: 3, Status: \"Approved\" },\n        { Id: 6, FormCode: \"PUR-PR-001\", Title: \"Purchase Requisition\", SubmittedBy: \"Siti Aminah\", SubmittedOn: DateValue(\"2026-06-04\"), CurrentStage: 2, TotalStages: 4, Status: \"Rejected\" }\n      );\n\n    "
    Theme: =PowerAppsTheme
