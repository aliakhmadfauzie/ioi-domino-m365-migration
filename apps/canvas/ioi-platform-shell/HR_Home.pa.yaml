Screens:
  HR_Home:
    Properties:
      Fill: =ColorBg
      OnVisible: =Set(gblActiveSite, Coalesce(gblActiveSite, "Johor"))
    Children:
      - HRHomeRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - HRHomeHeader:
                Control: Header
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =ColorPrimary
                  Height: =64
                  Style: ='Header.Style'.Primary
                  Title: ="HR Portal"
                  UserName: =gblCurrentUser
            - HRHomeSubheader:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorMuted
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: ="Human Resources — " & gblActiveSite
                  Wrap: =false
            - HRHomeStatsRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =84
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - KPICardSR:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Fill: =ColorSurface
                        Height: =80
                        Width: =160
                        OnSelect: =Navigate(SR_List, ScreenTransition.Fade)
                  - KPISRCount:
                      Control: ModernText
                      Properties:
                        Color: =ColorPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: |=Text(CountRows(Filter(MainDB_HR, FormType = "SR" && CurrentStatus = "Submitted")))
                        X: =16
                        Y: =8
                        Wrap: =false
                  - KPISRLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Pending SR"
                        X: =16
                        Y: =44
                        Wrap: =false
                  - KPICardLeave:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Fill: =ColorSurface
                        Height: =80
                        Width: =160
                        OnSelect: =Navigate(SR_List, ScreenTransition.Fade)
                  - KPILVCount:
                      Control: ModernText
                      Properties:
                        Color: =ColorPending
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: |=Text(CountRows(Filter(MainDB_HR, FormType = "LVE" && CurrentStatus = "Submitted")))
                        X: =16
                        Y: =8
                        Wrap: =false
                  - KPILVLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Pending Leave"
                        X: =16
                        Y: =44
                        Wrap: =false
                  - KPICardMCL:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Fill: =ColorSurface
                        Height: =80
                        Width: =160
                  - KPIMCLCount:
                      Control: ModernText
                      Properties:
                        Color: =ColorApproved
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: |=Text(CountRows(Filter(MainDB_HR, FormType = "MCL" && CurrentStatus = "Submitted")))
                        X: =16
                        Y: =8
                        Wrap: =false
                  - KPMCLLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Medical Claims"
                        X: =16
                        Y: =44
                        Wrap: =false
                  - KPICardForms:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Fill: =ColorSurface
                        Height: =80
                        Width: =160
                  - KPIFormsCount:
                      Control: ModernText
                      Properties:
                        Color: =ColorText
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: ="42"
                        X: =16
                        Y: =8
                        Wrap: =false
                  - KPIFormsLabel:
                      Control: ModernText
                      Properties:
                        Color: =ColorMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="HR Forms"
                        X: =16
                        Y: =44
                        Wrap: =false
            - HRHomeSectionTitle:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorText
                  FillPortions: =0
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =18
                  Text: ="Quick Actions"
                  Wrap: =false
            - HRHomeActionsRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =56
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnSRNew:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorPrimary
                        Height: =48
                        OnSelect: =Navigate(SR_New, ScreenTransition.Fade)
                        Text: ="Staff Requisition"
                        Width: =180
                  - btnLVENew:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ColorPrimary
                        Height: =48
                        OnSelect: =Notify("Leave Application screen is next in the HR Canvas build sequence.", NotificationType.Information)
                        Text: ="Leave Application"
                        Width: =180
                  - btnMCLNew:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ColorPrimary
                        Height: =48
                        OnSelect: =Notify("Medical Claim screen is next in the HR Canvas build sequence.", NotificationType.Information)
                        Text: ="Medical Claim"
                        Width: =180
            - HRHomeSectionPending:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorText
                  FillPortions: =0
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =18
                  Text: ="Pending Approvals"
                  Wrap: =false
            - HRHomePendingNote:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorMuted
                  FillPortions: =0
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: ="Items awaiting your approval"
                  Wrap: =false
            - HRHomeGallery:
                Control: Gallery
                Variant: Vertical
                Properties:
                  FillPortions: =0
                  Height: =300
                  Items: |=Filter(
                      MainDB_HR,
                      FormType = "SR",
                      CurrentStatus = "Submitted"
                    )
                  ShowScrollbar: =true
                  TemplatePadding: =8
                  TemplateSize: =72
                Children:
                  - cardPending:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Fill: =ColorSurface
                        Height: =Parent.TemplateHeight
                        OnSelect: |=Set(gblActiveRecordID, ThisItem.ID);
                          Navigate(SR_Detail, ScreenTransition.Fade)
                        Width: =Parent.TemplateWidth
                  - txtPendingFormCode:
                      Control: ModernText
                      Properties:
                        Color: =ColorPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =ThisItem.FormType
                        Wrap: =false
                        X: =16
                        Y: =10
                  - txtPendingTitle:
                      Control: ModernText
                      Properties:
                        Color: =ColorText
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =Coalesce(ThisItem.Title, ThisItem.VacancyTitle)
                        Wrap: =false
                        X: =16
                        Y: =36
                  - badgePendingStatus:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Tint
                        Content: =ThisItem.CurrentStatus
                        Height: =24
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: ='BadgeCanvas.ThemeColor'.Warning
                        Width: =100
                        X: =Parent.TemplateWidth - 120
                        Y: =14
