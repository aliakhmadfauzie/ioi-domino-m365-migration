Screens:
  Browse:
    Properties:
      Fill: =ColorBg
      OnVisible: =Set(gblActiveSite, Coalesce(gblActiveSite, "Johor"))
    Children:
      - rootBrowse:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Width: =Parent.Width
          Children:
            - topBarBrowse:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnBackBrowse:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =ColorPrimary
                        Icon: =Icon.Home
                        OnSelect: =Navigate(Home, ScreenTransition.UnCover)
                        Text: ="Home"
                        Width: =120
                  - txtBrowseTitle:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =ColorText
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =24
                        Text: ="Forms — " & gblActiveSite
                        Wrap: =false
            - filterRowBrowse:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - ddDeptBrowse:
                      Control: ModernDropdown
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =Appearance.Outline
                        Color: =ColorText
                        ItemDisplayText: ="DeptName"
                        Items: =Filter(colDepartments, Site = gblActiveSite)
                        OnChange: =Set(gblActiveDept, Self.Selected.DeptCode)
                        Width: =280
                  - txtSearch:
                      Control: ModernTextInput
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =Appearance.Outline
                        FillPortions: =1
                        Placeholder: ="Search by code or title"
                        Type: =TextInputType.Search
            - galForms:
                Control: Gallery
                Variant: Vertical
                Properties:
                  FillPortions: =0
                  Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                  Items: |-
                    =Filter(
                       colForms,
                       Site = gblActiveSite,
                       (IsBlank(gblActiveDept) || DeptCode = gblActiveDept),
                       (IsBlank(txtSearch.Text) ||
                         txtSearch.Text in FormCode || txtSearch.Text in Title)
                    )
                  ShowScrollbar: =false
                  TemplatePadding: =8
                  TemplateSize: =88
                Children:
                  - cardRowForm:
                      Control: ModernCard
                      Properties:
                        BorderRadius: =10
                        Fill: =ColorSurface
                        HeaderImage: =""
                        Height: =Parent.TemplateHeight
                        Image: =""
                        OnSelect: |-
                          =Set(gblActiveFormCode, ThisItem.FormCode);
                          Set(gblActiveDept, ThisItem.DeptCode);
                          Navigate(FormView, ScreenTransition.Cover)
                        Width: =Parent.TemplateWidth
                  - txtRowFormCode:
                      Control: ModernText
                      Properties:
                        Color: =ColorPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: =ThisItem.FormCode
                        Width: =Parent.TemplateWidth - 32
                        Wrap: =false
                        X: =16
                        Y: =12
                  - txtRowFormTitle:
                      Control: ModernText
                      Properties:
                        Color: =ColorText
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =ThisItem.Title
                        Width: =Parent.TemplateWidth - 220
                        Wrap: =false
                        X: =16
                        Y: =40
                  - badgeRowPattern:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Tint
                        Content: =ThisItem.Pattern
                        Height: =24
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: ='BadgeCanvas.ThemeColor'.Informative
                        Width: =150
                        X: =Parent.TemplateWidth - 320
                        Y: =14
                  - badgeRowStages:
                      Control: Badge
                      Properties:
                        Appearance: ='BadgeCanvas.Appearance'.Tint
                        Content: =Text(ThisItem.ApprovalStages) & "-stage"
                        Height: =24
                        Shape: ='BadgeCanvas.Shape'.Rounded
                        ThemeColor: ='BadgeCanvas.ThemeColor'.Brand
                        Width: =110
                        X: =Parent.TemplateWidth - 150
                        Y: =14
